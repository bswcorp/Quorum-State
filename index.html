<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSPA Human Rights Ledger | QuorumState International Network</title>

<link href="https://googleapis.com" rel="stylesheet">

<style>
:root {
    --ibm-blue: #0f62fe;
    --deep-space: #050816;
    --galaxy-blue: #081b3a;
    --neon-cyan: #00e5ff;
    --starlight: #d7f9ff;
    --callforcode-blue: #0043ce;
    --sdg-green: #00ff99;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: var(--deep-space);
    color: var(--starlight);
    font-family:'Rajdhani', sans-serif;
    overflow-x:hidden;
}

/* BACKGROUND ECOSYSTEM */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 10% 15%, rgba(15, 98, 254, 0.15), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(0, 229, 255, 0.12), transparent 45%),
    var(--deep-space);
    z-index:-3;
}

.stars{
    position:fixed;
    inset:0;
    background:url('https://transparenttextures.com');
    opacity:0.25;
    z-index:-2;
    animation: spaceFloat 180s linear infinite;
}

@keyframes spaceFloat {
    from { background-position: 0 0; }
    to { background-position: 0 -1200px; }
}

.orbit-line {
    position: absolute;
    top: 52%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    height: 650px;
    border: 1px dashed rgba(0, 229, 255, 0.12);
    border-radius: 50%;
    z-index: -1;
    animation: rotateOrbit 40s linear infinite;
}

@keyframes rotateOrbit {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* HEADER CONTAINER */
header{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    padding:30px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:100;
}

.brand-title {
    font-family:'Orbitron', sans-serif;
    font-size:1.4rem;
    font-weight:900;
    color: var(--neon-cyan);
    letter-spacing:3px;
    text-shadow:0 0 15px rgba(0,229,255,0.4);
}

.root-badge {
    background: rgba(15, 98, 254, 0.1);
    border: 1px solid var(--ibm-blue);
    color: #fff;
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
}

/* HERO LAYER */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:160px 8% 40px;
    text-align:center;
    position:relative;
}

.hero-content{
    max-width:950px;
}

.tagline-top {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    color: var(--neon-cyan);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.hero h1{
    font-family:'Orbitron', sans-serif;
    font-size: 5rem;
    line-height:1.1;
    margin-bottom:25px;
    background: linear-gradient(135deg, #ffffff, var(--neon-cyan), var(--ibm-blue));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    font-weight: 900;
}

.hero p{
    font-size:1.4rem;
    line-height:1.7;
    color: #b9cedb;
    margin-bottom:40px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
}

.btn-primary {
    background: var(--ibm-blue);
    color: white;
    padding: 16px 36px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 1px;
    font-family: 'Orbitron', sans-serif;
    box-shadow: 0 4px 20px rgba(15, 98, 254, 0.4);
    transition: all 0.3s ease;
    display: inline-block;
}

.btn-primary:hover {
    background: var(--callforcode-blue);
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(0, 67, 206, 0.6);
}

/* REVISI 4: IMPACT METRICS LAYERS */
.metrics-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    width: 84%;
    margin: 0 auto 60px;
}

.metric-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(15, 98, 254, 0.15);
    padding: 20px;
    border-radius: 6px;
    text-align: center;
}

.metric-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--neon-cyan);
    margin-bottom: 5px;
}

.metric-label {
    font-size: 0.95rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* REVISI TAMBAHAN: WHY SSPA MATTERS LAYER */
.why-matters-section {
    padding: 60px 8%;
    background: rgba(15, 98, 254, 0.04);
    border-top: 1px solid rgba(15, 98, 254, 0.15);
    border-bottom: 1px solid rgba(15, 98, 254, 0.15);
}

.section-title {
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 50px;
    color: #fff;
    letter-spacing: 2px;
}

.section-title span {
    color: var(--neon-cyan);
}

.why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto;
}

.why-card {
    background: rgba(5, 8, 22, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 30px;
    border-radius: 6px;
    transition: transform 0.2s ease;
}

.why-card:hover {
    transform: translateY(-3px);
}

.why-icon {
    font-size: 2rem;
    margin-bottom: 15px;
    display: inline-block;
}

.why-card h3 {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    margin-bottom: 12px;
    font-size: 1.3rem;
}

.why-card p {
    color: #94a3b8;
    line-height: 1.6;
}

/* LAYER 2: PROBLEM & IMPACT AREA */
.problem-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 60px 8%;
    background: rgba(8, 27, 58, 0.3);
}

.problem-card {
    background: rgba(5, 8, 22, 0.6);
    border-left: 3px solid #ff3366;
    padding: 25px;
    border-radius: 0 8px 8px 0;
}

.problem-card h3 {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    margin-bottom: 10px;
    font-size: 1.2rem;
}

.problem-card p {
    color: #a2b4c7;
    font-size: 0.95rem;
    line-height: 1.5;
}

/* LAYER 3: HUMAN-CENTRIC ARCHITECTURE */
.architecture-section {
    padding: 80px 8%;
    text-align: center;
}

.flow-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 500px;
    margin: 40px auto 0;
}

.flow-node {
    background: rgba(15, 98, 254, 0.1);
    border: 1px solid var(--ibm-blue);
    padding: 15px 40px;
    border-radius: 4px;
    width: 100%;
    font-family: 'Orbitron', sans-serif;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    box-shadow: inset 0 0 10px rgba(15, 98, 254, 0.2);
}

.flow-arrow {
    color: var(--neon-cyan);
    font-size: 1.5rem;
    margin: 10px 0;
    text-shadow: 0 0 8px var(--neon-cyan);
}

/* LAYER 4: UNITED NATIONS SDG ALIGNMENT (REVISI 2: FEATURED SDG 16) */
.sdg-section {
    padding: 80px 8%;
    background: rgba(5, 8, 22, 0.7);
}

.sdg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.sdg-card {
    background: var(--galaxy-blue);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 25px 20px;
    text-align: center;
    border-radius: 6px;
}

.sdg-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.3rem;
    font-weight: 900;
    color: #64748b;
    margin-bottom: 10px;
}

.sdg-card h4 {
    font-size: 1.05rem;
    color: #cbd5e1;
}

/* HIGHLIGHT SDG 16 PANEL */
.featured-sdg {
    border: 2px solid var(--ibm-blue);
    box-shadow: 0 0 25px rgba(15, 98, 254, 0.35);
    background: rgba(15, 98, 254, 0.15);
    grid-column: span 1;
}

.featured-sdg .sdg-number {
    color: var(--neon-cyan);
    text-shadow: 0 0 15px var(--ibm-blue);
}

.featured-sdg h4 {
    color: #fff;
    font-weight: 700;
}

.featured-badge {
    display: inline-block;
    font-size: 0.75rem;
    text-transform: uppercase;
    background: var(--ibm-blue);
    color: #fff;
    padding: 2px 10px;
    border-radius: 4px;
    margin-top: 10px;
    letter-spacing: 1px;
}

/* LAYER 5: FUTURE ROADMAP (REVISI 5: REMOVED ECONOMY TOKEN BUZZWORDS) */
.roadmap-section {
    padding: 80px 8% 120px;
}

.roadmap-timeline {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 1100px;
    margin: 50px auto 0;
}

.roadmap-step {
    background: rgba(255, 255, 255, 0.02);
    border-top: 3px solid var(--neon-cyan);
    padding: 25px 20px;
    border-radius: 0 0 6px 6px;
    border-left: 1px solid rgba(255, 255, 255, 0.04);
    border-right: 1px solid rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.roadmap-step h4 {
    font-family: 'Orbitron', sans-serif;
    color: var(--neon-cyan);
    margin-bottom: 12px;
    font-size: 1.15rem;
    letter-spacing: 1px;
}

.roadmap-step p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #94a3b8;
}

/* FOOTER CORES */
footer {
    padding: 50px 20px;
    text-align: center;
    background: #03050f;
    border-top: 1px solid rgba(15, 98, 254, 0.15);
}

footer p {
    color: #536b82;
    font-size: 0.95rem;
}

@media(max-width: 992px) {
    .metrics-container { width: 100%; }
}

@media(max-width: 768px) {
    .hero h1 { font-size: 3.2rem; }
    .featured-sdg { grid-column: span 1; }
}
</style>
</head>
<body>

<div class="stars"></div>

<header>
    <div class="brand-title">QUORUMSTATE</div>
    <div class="root-badge">GATEWAY NODE ACTIVE</div>
</header>

<!-- LAYER 1: VISUAL HERO EXPERIENCE -->
<section class="hero">
    <div class="orbit-line"></div>
    <div class="hero-content">
        <div class="tagline-top">Next-Generation Humanitarian Infrastructure</div>
        <h1>SSPA Human Rights Ledger</h1>
